<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AUT0MARKETING - Acesso Administrativo</title>
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-body">

  <div class="login-card">
    <div class="text-center mb-4">
      <div class="brand-icon mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.6rem;">
        <i class="bi bi-broadcast"></i>
      </div>
      <h2 class="fw-bold text-white mb-1">AUT0MARKETING</h2>
      <p class="text-secondary small">Automação Inteligente de Afiliados & Comunidades</p>
    </div>

    <form id="login-form">
      <div class="mb-3">
        <label for="username" class="form-label">Usuário Administrativo</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-person"></i></span>
          <input type="text" id="username" class="form-control" placeholder="ex: admin" value="admin" required autofocus>
        </div>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label">Senha de Acesso</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-shield-lock"></i></span>
          <input type="password" id="password" class="form-control" placeholder="Sua senha" value="admin123" required>
        </div>
      </div>

      <div class="d-grid mb-3">
        <button type="submit" id="btn-login-submit" class="btn btn-primary-custom py-2">
          <i class="bi bi-box-arrow-in-right me-2"></i>Acessar Painel
        </button>
      </div>

      <div class="p-3 rounded bg-dark border border-secondary border-opacity-25 text-center">
        <p class="text-muted small mb-1"><i class="bi bi-key me-1"></i> Credenciais padrão de demonstração:</p>
        <code class="text-info fw-bold">admin</code> / <code class="text-info fw-bold">admin123</code>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
